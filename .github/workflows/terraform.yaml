name: "Deploy Terraform to Azure"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      destroy:
        description: "Set to 'true' to destroy resources (⚠️ Be careful!)"
        required: false
        default: "false"
      confirm:
        description: "Type 'DESTROY' to confirm deletion"
        required: false
        default: ""

jobs:
  terraform:
    if: github.event.inputs.destroy != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.backend_rg_name }}" \
            -backend-config="storage_account_name=${{ env.backend_storage_account }}" \
            -backend-config="container_name=${{ env.backend_container }}" \
            -backend-config="key=${{ env.backend_key }}"
        env:
          backend_rg_name: ${{ vars.backend_rg_name }}
          backend_storage_account: ${{ vars.backend_storage_account }}
          backend_container: ${{ vars.backend_container }}
          backend_key: ${{ vars.backend_key }}
  
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

  terraform-destroy:
    if: github.event.inputs.destroy == 'true' && github.event.inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.backend_rg_name }}" \
            -backend-config="storage_account_name=${{ env.backend_storage_account }}" \
            -backend-config="container_name=${{ env.backend_container }}" \
            -backend-config="key=${{ env.backend_key }}"
        env:
          backend_rg_name: ${{ vars.backend_rg_name }}
          backend_storage_account: ${{ vars.backend_storage_account }}
          backend_container: ${{ vars.backend_container }}
          backend_key: ${{ vars.backend_key }}

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
